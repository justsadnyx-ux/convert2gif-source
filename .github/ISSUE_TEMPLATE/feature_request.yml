name: Feature request
description: Something you would like to see.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you want?
      description: Describe the feature and the problem it solves (the "why").
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - The /gif bot (bot.js / media.js)
        - Setup / config / docs
    validations:
      required: true