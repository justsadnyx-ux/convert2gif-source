name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          if rg -il "MTU0NzY4|GlY1Fa|cfut_Q|BeaStly" --glob '!node_modules/**' . ; then
            echo "Secret-like string found in the tree" && exit 1
          fi