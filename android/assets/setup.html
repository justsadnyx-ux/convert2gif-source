<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Convert2GIF · Connect</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body{ background:#06090d; color:#e6edf3; font-family:Roboto,'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.card{ width:100%; max-width:380px; background:linear-gradient(180deg,#0d131b,#111a24); border:1px solid #1e2a38; border-radius:18px; padding:24px; }
h1{ font-size:20px; font-weight:800; letter-spacing:.4px; }
h1 span{ color:#2dd4bf; }
.sub{ color:#8b98a5; font-size:12px; margin:4px 0 18px; line-height:1.5; }
label{ display:block; font-size:11px; color:#8b98a5; text-transform:uppercase; letter-spacing:1px; margin:12px 0 6px; font-weight:700; }
input{ width:100%; background:#0a0f15; border:1px solid #1e2a38; border-radius:12px; padding:13px 14px; color:#e6edf3; font-size:14px; outline:none; }
input:focus{ border-color:#14b8a6; }
button{ width:100%; margin-top:18px; background:linear-gradient(135deg,#14b8a6,#2dd4bf); border:0; border-radius:12px; padding:15px; font-size:15px; font-weight:800; color:#04252a; }
button:active{ transform:scale(.97); }
.hint{ margin-top:14px; font-size:11.5px; color:#61707f; line-height:1.5; }
.hint b{ color:#9fb2c2; }
</style>
</head>
<body>
<div class="card">
  <h1>Convert2GIF <span>BETA</span></h1>
  <div class="sub">Same control panel as your PC bootstrappa, but in your palm. Enter your desktop IP + access code.</div>
  <label>Desktop IP (from the bootstrapper panel)</label>
  <input id="ip" placeholder="192.168.1.23"/>
  <label>Port</label>
  <input id="port" value="45579" inputmode="numeric"/>
  <label>Access code</label>
  <input id="tok" placeholder="paste the code from the desktop panel"/>
  <button onclick="go()">CONNECT 💪</button>
  <div class="hint">Open the bootstrapper on your PC, look for <b>&quot;Phone (BETA)&quot;</b> and copy the URL. Paste the IP and the code here. Both devices on the same Wi-Fi.</div>
</div>
<script>
function go(){
  var ip=(document.getElementById('ip').value||'').trim();
  var port=(document.getElementById('port').value||'45579').trim();
  var tok=(document.getElementById('tok').value||'').trim();
  if(!ip){ document.getElementById('ip').focus(); return; }
  var url='http://'+ip+':'+port+'/#'+tok;
  if(window.Android){ Android.open(url); }
  else { window.location.href=url; }
}
</script>
</body>
</html>
