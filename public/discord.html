<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://discord.gg/<YOUR_INVITE_CODE>" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Join the Convert2GIF Discord</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090b10; color: #f0f2f7; min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
    }
    .wrap { max-width: 540px; text-align: center }
    h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 800; margin-bottom: 14px;
      background: linear-gradient(100deg,#5865f2,#818cf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
    p { color: #aab4c6; font-size: 16px; line-height: 1.7; margin-bottom: 18px }
    a { color: #fff; text-decoration: none; font-weight: 700; font-size: 17px; display: inline-block; margin-top: 12px; padding: 13px 30px; border-radius: 10px; background: #5865f2; transition: background .2s }
    a:hover { background: #818cf8 }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Join the Convert2GIF Server</h1>
    <p>You need to be a member of the Convert2GIF server to use the bot. You're being redirected automatically — if nothing happens, click below.</p>
    <a href="https://discord.gg/<YOUR_INVITE_CODE>">Join Convert2GIF on Discord</a>
